<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galaxong</title>
    <!-- Favicon (Icono de la página) -->
    <link class="imagen-redonda" rel="icon" type="image/x-icon" href="img/nave.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    <div id="ui">
        <button id="pauseButton">Pausar</button>
        <button id="restartButton">Reiniciar</button>
        <button id="exitButton">Salir</button>
        <div id="scoreBoard">
            <p>Puntos: <span id="score">0</span></p>
            <p>Disparos: <span id="shots">0</span></p>
            <p>Enemigos: <span id="enemies">0</span></p>
            <!-- Agregamos el temporizador -->
            <div id="timerContainer">
                <span>Tiempo:</span>
                <span id="timer">1:30</span>
            </div>
        <div id="titulo">
            Juego Galaxong
        </div>
        <div style="width: 100%; background-color: rgb(173, 173, 173); border-radius: 5px; position: relative;">
            <div id="progressBar" style="width: 0%; height: 30px; background-color: red; text-align: center; line-height: 30px; color: white; border-radius: 5px; font-weight: bold;">
                0%
            </div>
        </div>
        
        
    </div>

    <script src="juego.js"></script>
</body>
</html>
